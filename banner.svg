<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="220" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="28%" stop-color="#1E293B"/>
      <stop offset="68%" stop-color="#273549"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="waveTop1" x1="0" y1="120" x2="840" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="waveTop2" x1="0" y1="150" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="waveBottom" x1="0" y1="520" x2="840" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Continuous Slate-Navy Backdrop -->
  <rect width="840" height="650" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="838.5" height="648.5" rx="17.25" stroke="#64748B" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- Soft Flowing Waves -->
  <path d="M0 142 C180 104, 340 176, 540 134 C670 108, 760 130, 840 112 L840 215 C680 198, 420 225, 0 198 Z" fill="url(#waveTop1)"/>
  <path d="M0 166 C220 196, 410 130, 620 164 C730 180, 795 160, 840 152 L840 230 C620 218, 310 236, 0 212 Z" fill="url(#waveTop2)"/>
  <path d="M0 578 C200 546, 410 612, 630 568 C740 546, 800 562, 840 554 L840 632 C840 641.9 831.9 650 822 650 L18 650 C8.1 650 0 641.9 0 632 Z" fill="url(#waveBottom)"/>

  <!-- Subtle Stars -->
  <circle cx="96" cy="46" r="2" fill="#E2E8F0" fill-opacity="0.45"/>
  <circle cx="144" cy="74" r="1.4" fill="#CBD5E1" fill-opacity="0.32"/>
  <circle cx="716" cy="42" r="2.2" fill="#E2E8F0" fill-opacity="0.45"/>
  <circle cx="754" cy="76" r="1.5" fill="#CBD5E1" fill-opacity="0.30"/>
  <circle cx="684" cy="86" r="1.2" fill="#F8FAFC" fill-opacity="0.35"/>

  <!-- Hero Title -->
  <text x="420" y="92" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="2">Silnoon</text>
  <text x="420" y="126" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.4">Building products from everyday life, sharing the process.</text>

  <!-- Greeting & Bio -->
  <text x="420" y="242" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">안녕하세요, 일상의 작은 불편을 서비스로 만드는 Silnoon입니다.</text>
  <text x="420" y="276" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13.5" font-style="italic">문학을 읽던 시선으로 사람을 관찰하고, 코드를 써서 실제 쓰이는 앱으로 옮깁니다.</text>
  <text x="420" y="300" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13.5" font-style="italic">만드는 데서 멈추지 않고, 사용자의 목소리를 다시 코드로 연결하며 성장하고 있습니다.</text>

  <!-- Subtle Section Divider -->
  <line x1="56" y1="330" x2="784" y2="330" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1"/>

  <!-- About Me Section -->
  <rect x="56" y="352" width="4" height="18" rx="2" fill="#94A3B8"/>
  <text x="70" y="366" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">About Me</text>

  <!-- Card 1 -->
  <rect x="56" y="384" width="728" height="54" rx="10" fill="#0F172A" fill-opacity="0.32" stroke="#64748B" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="74" cy="404" r="3" fill="#94A3B8"/>
  <text x="86" y="408" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700">Product Builder &amp; Android Developer</text>
  <text x="86" y="427" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12">2026년 개발을 시작해 사업자 등록 후, Google Play에서 25개 이상의 Android 앱을 직접 기획·개발·운영해 왔습니다.</text>

  <!-- Card 2 -->
  <rect x="56" y="447" width="728" height="54" rx="10" fill="#0F172A" fill-opacity="0.32" stroke="#64748B" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="74" cy="467" r="3" fill="#94A3B8"/>
  <text x="86" y="471" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700">User-Driven Iteration</text>
  <text x="86" y="490" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12">앱을 출시한 뒤 직접 써 보고, 사용자 리뷰를 읽으며 불편한 지점을 코드 수정으로 연결하는 과정을 가장 중요하게 생각합니다.</text>

  <!-- Card 3 -->
  <rect x="56" y="510" width="728" height="54" rx="10" fill="#0F172A" fill-opacity="0.32" stroke="#64748B" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="74" cy="530" r="3" fill="#94A3B8"/>
  <text x="86" y="534" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700">Deepening Fundamentals</text>
  <text x="86" y="553" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12">빠르게 만들어 본 경험 위에 Kotlin, 자료구조·알고리즘, 앱 구조를 차근차근 쌓으며 기존 코드를 점검하고 리팩토링하고 있습니다.</text>

  <!-- Card 4 -->
  <rect x="56" y="573" width="728" height="54" rx="10" fill="#0F172A" fill-opacity="0.32" stroke="#64748B" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="74" cy="593" r="3" fill="#94A3B8"/>
  <text x="86" y="597" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700">Writing &amp; Sharing</text>
  <text x="86" y="616" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12">기획부터 출시, 운영, 코드 개선까지의 고민과 기록을 GitHub · LinkedIn · YouTube(시도노트)에 꾸준히 남깁니다.</text>
</svg>
